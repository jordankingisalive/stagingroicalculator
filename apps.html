<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps &amp; Behavior — M365 Copilot ROI Calculator</title>
    <link rel="stylesheet" href="styles.css?v=30">
    <style>
        .insights-card { background: var(--surface, #1E293B); border: 1px solid var(--border, rgba(255,255,255,0.08)); border-radius: 16px; padding: 2rem; margin-bottom: 1.5rem; }
        .insights-card h2 { color: var(--text-primary, #F1F5F9); margin: 0 0 0.5rem; font-size: 1.4rem; }
        .insights-card .lede { color: var(--text-secondary, #94A3B8); margin: 0 0 1.5rem; }
        .behavior-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
        .behavior-card { background: var(--surface-raised, #253449); border-radius: 12px; padding: 1.25rem; border-top: 3px solid; }
        .behavior-card h3 { margin: 0 0 0.75rem; color: var(--text-primary, #F1F5F9); font-size: 1rem; }
        .app-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.5rem; }
        .app-row .name { flex: 0 0 130px; font-size: 0.85rem; color: var(--text-primary, #F1F5F9); }
        .app-row .bar { flex: 1; height: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden; }
        .app-row .bar-fill { height: 100%; background: var(--copilot-cyan, #00D4FF); }
        .app-row .pct { flex: 0 0 50px; text-align: right; font-size: 0.8rem; color: var(--text-secondary, #94A3B8); font-variant-numeric: tabular-nums; }
        .kpi-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .kpi { flex: 1 1 180px; background: var(--surface-raised, #253449); border-radius: 12px; padding: 1.25rem; border-left: 4px solid var(--copilot-cyan, #00D4FF); }
        .kpi .label { font-size: 0.8rem; color: var(--text-secondary, #94A3B8); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
        .kpi .value { font-size: 1.75rem; font-weight: 700; color: var(--text-primary, #F1F5F9); }
        .kpi .sub { font-size: 0.8rem; color: var(--text-secondary, #94A3B8); margin-top: 0.25rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div>
                    <h1>Apps &amp; Behavior</h1>
                    <p class="subtitle">Where the action happens — per-app attribution and the behavioral signature of your Power Users</p>
                </div>
            </div>
        </header>
        <nav class="nav-buttons" id="nav"></nav>
        <main id="main"></main>
        <div id="footer"></div>
    </div>
    <script src="insights-shared.js?v=6"></script>
    <script src="insights-tabs.js?v=1"></script>
    <script>
        document.getElementById('nav').outerHTML = InsightsShared.renderNav('apps.html');
        document.getElementById('footer').outerHTML = InsightsShared.renderFooter();
        (function init() {
            const main = document.getElementById('main');
            const data = InsightsShared.loadSharedData();
            if (!data) { InsightsShared.renderEmptyState(main, 'Apps & Behavior'); return; }
            InsightsTabs.renderApps(main, data);
        })();
    </script>
</body>
</html>
