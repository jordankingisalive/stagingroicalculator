<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forecast &amp; Sensitivity — M365 Copilot ROI Calculator</title>
    <link rel="stylesheet" href="styles.css?v=30">
    <style>
        .insights-card { background: var(--surface, #1E293B); border: 1px solid var(--border, rgba(255,255,255,0.08)); border-radius: 16px; padding: 2rem; margin-bottom: 1.5rem; }
        .insights-card h2 { color: var(--text-primary, #F1F5F9); margin: 0 0 0.5rem; font-size: 1.4rem; }
        .insights-card .lede { color: var(--text-secondary, #94A3B8); margin: 0 0 1.5rem; }
        .kpi-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .kpi { flex: 1 1 180px; background: var(--surface-raised, #253449); border-radius: 12px; padding: 1.25rem; border-left: 4px solid var(--copilot-cyan, #00D4FF); }
        .kpi .label { font-size: 0.8rem; color: var(--text-secondary, #94A3B8); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
        .kpi .value { font-size: 1.75rem; font-weight: 700; color: var(--text-primary, #F1F5F9); }
        .kpi .sub { font-size: 0.8rem; color: var(--text-secondary, #94A3B8); margin-top: 0.25rem; }
        .slider-control { display: flex; align-items: center; gap: 1rem; margin: 1rem 0; flex-wrap: wrap; }
        .slider-control label { color: var(--text-primary, #F1F5F9); min-width: 200px; }
        .slider-control input[type=range] { flex: 1; min-width: 200px; max-width: 360px; accent-color: var(--copilot-cyan, #00D4FF); }
        .slider-control .val { font-weight: 700; color: var(--copilot-cyan, #00D4FF); min-width: 60px; text-align: right; font-variant-numeric: tabular-nums; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div>
                    <h1>Forecast &amp; Sensitivity</h1>
                    <p class="subtitle">Project where adoption is heading, test alternate valuation models, and find which assumption matters most</p>
                </div>
            </div>
        </header>
        <nav class="nav-buttons" id="nav"></nav>
        <main id="main"></main>
        <div id="footer"></div>
    </div>
    <script src="insights-shared.js?v=6"></script>
    <script src="insights-tabs.js?v=1"></script>
    <script>
        document.getElementById('nav').outerHTML = InsightsShared.renderNav('forecast.html');
        document.getElementById('footer').outerHTML = InsightsShared.renderFooter();
        (function init() {
            const main = document.getElementById('main');
            const data = InsightsShared.loadSharedData();
            if (!data) { InsightsShared.renderEmptyState(main, 'Forecast & Sensitivity'); return; }
            InsightsTabs.renderForecast(main, data);
        })();
    </script>
</body>
</html>
