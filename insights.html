<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adoption Insights — M365 Copilot ROI Calculator</title>
    <link rel="stylesheet" href="styles.css?v=30">
    <style>
        .insights-card { background: var(--surface, #1E293B); border: 1px solid var(--border, rgba(255,255,255,0.08)); border-radius: 16px; padding: 2rem; margin-bottom: 1.5rem; }
        .insights-card h2 { color: var(--text-primary, #F1F5F9); margin: 0 0 0.5rem; font-size: 1.4rem; }
        .insights-card .lede { color: var(--text-secondary, #94A3B8); margin: 0 0 1.5rem; }
        .kpi-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
        .kpi { flex: 1 1 180px; background: var(--surface-raised, #253449); border-radius: 12px; padding: 1.25rem; border-left: 4px solid var(--copilot-cyan, #00D4FF); }
        .kpi .label { font-size: 0.8rem; color: var(--text-secondary, #94A3B8); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem; }
        .kpi .value { font-size: 1.75rem; font-weight: 700; color: var(--text-primary, #F1F5F9); }
        .kpi .sub { font-size: 0.8rem; color: var(--text-secondary, #94A3B8); margin-top: 0.25rem; }
        .migration-table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        .migration-table th, .migration-table td { padding: 0.5rem 0.75rem; text-align: center; font-size: 0.85rem; border: 1px solid rgba(255,255,255,0.05); }
        .migration-table th { background: var(--surface-raised, #253449); color: var(--text-secondary, #94A3B8); font-weight: 600; }
        .migration-table td.row-label { text-align: left; font-weight: 600; color: var(--text-primary, #F1F5F9); background: var(--surface-raised, #253449); }
        .migration-table td.diagonal { background: rgba(255,255,255,0.04); }
        .migration-table td.up { color: #10b981; font-weight: 600; }
        .migration-table td.down { color: #ef4444; font-weight: 600; }
        .chart-wrapper { overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div>
                    <h1>Adoption Insights</h1>
                    <p class="subtitle">Cohort trajectory, weekly migration, and time-to-habit from your Viva Insights export</p>
                </div>
            </div>
        </header>
        <nav class="nav-buttons" id="nav"></nav>
        <main id="main"></main>
        <div id="footer"></div>
    </div>
    <script src="insights-shared.js?v=6"></script>
    <script src="insights-tabs.js?v=1"></script>
    <script>
        document.getElementById('nav').outerHTML = InsightsShared.renderNav('insights.html');
        document.getElementById('footer').outerHTML = InsightsShared.renderFooter();
        (function init() {
            const main = document.getElementById('main');
            const data = InsightsShared.loadSharedData();
            if (!data) { InsightsShared.renderEmptyState(main, 'Adoption Insights'); return; }
            InsightsTabs.renderAdoption(main, data);
        })();
    </script>
</body>
</html>
