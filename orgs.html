<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizations — M365 Copilot ROI Calculator</title>
    <link rel="stylesheet" href="styles.css?v=30">
    <style>
        .insights-card { background: var(--surface, #1E293B); border: 1px solid var(--border, rgba(255,255,255,0.08)); border-radius: 16px; padding: 2rem; margin-bottom: 1.5rem; }
        .insights-card h2 { color: var(--text-primary, #F1F5F9); margin: 0 0 0.5rem; font-size: 1.4rem; }
        .insights-card .lede { color: var(--text-secondary, #94A3B8); margin: 0 0 1.5rem; }
        .org-table { width: 100%; border-collapse: collapse; }
        .org-table th { padding: 0.75rem 1rem; text-align: left; background: var(--surface-raised, #253449); color: var(--text-secondary, #94A3B8); font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .org-table td { padding: 0.85rem 1rem; color: var(--text-primary, #F1F5F9); font-size: 0.95rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .org-table tr.expandable { cursor: pointer; transition: background 0.15s; }
        .org-table tr.expandable:hover { background: rgba(0,212,255,0.04); }
        .org-table .num { text-align: right; font-variant-numeric: tabular-nums; }
        .org-detail { background: rgba(0,212,255,0.04); padding: 1.5rem 2rem; border-left: 3px solid var(--copilot-cyan, #00D4FF); }
        .org-detail .cohort-pill { display: inline-block; padding: 0.4rem 0.85rem; border-radius: 999px; font-size: 0.85rem; margin: 0.25rem 0.4rem 0.25rem 0; color: white; font-weight: 600; }
        .controls { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
        .controls input, .controls select { background: var(--surface-raised, #253449); border: 1px solid var(--border, rgba(255,255,255,0.08)); color: var(--text-primary, #F1F5F9); padding: 0.5rem 0.85rem; border-radius: 8px; font-size: 0.9rem; }
        .controls label { color: var(--text-secondary, #94A3B8); font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="header-content">
                <div>
                    <h1>Organizations</h1>
                    <p class="subtitle">Per-org leaderboard with sparklines — click any row to expand its cohort breakdown</p>
                </div>
            </div>
        </header>
        <nav class="nav-buttons" id="nav"></nav>
        <main id="main"></main>
        <div id="footer"></div>
    </div>
    <script src="insights-shared.js?v=6"></script>
    <script src="insights-tabs.js?v=1"></script>
    <script>
        document.getElementById('nav').outerHTML = InsightsShared.renderNav('orgs.html');
        document.getElementById('footer').outerHTML = InsightsShared.renderFooter();
        (function init() {
            const main = document.getElementById('main');
            const data = InsightsShared.loadSharedData();
            if (!data) { InsightsShared.renderEmptyState(main, 'Organizations'); return; }
            InsightsTabs.renderOrgs(main, data);
        })();
    </script>
</body>
</html>
